<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montenegrin+Gothic+One&family=Pixelify+Sans:wght@400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Password_strength_checker</title>
</head>

<body>
    <header>
        <div id="aurora-bg"></div>
        <div class="passwordtitle">
            <h1>Password Strength Checker</h1>
        </div>
        <div class="password_entry_box">
            <input type="password" id="password" placeholder="Enter your password">
            <button type="button" id="toggleBtn" aria-label="Show password"><i id="eye" class="fa-regular fa-eye"></i></button>
        </div>
        <button type="button" class="check">
            <h2 id="check_word">Check</h2>
        </button>
    </header>
    <main>
        <div class="strength">
            <h2 id="strength_word">Strength</h2>
            <div class="strength_bar">
                <div class="strength_fill" id="strength_fill"></div>
            </div>
        <script src="index.js"></script>
        <script type="module" src="aurora-init.js"></script>
    </main>
</body>

</html>
